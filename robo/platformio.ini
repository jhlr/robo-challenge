; Robo da competicao (ESP32 DevKit classico, CP2102).
;   Missao:   pio run -e robo -t upload
;   Bancada:  pio run -e bancada -t upload   (menu no monitor serial para testar sensores, rodas e braco um por um)
; Se a placa nao entra em modo de gravacao sozinha: segure BOOT, toque EN, solte BOOT e use `-e robo_manual`.
[platformio]
default_envs = robo

[env:robo]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    madhephaestus/ESP32Servo@^3.0.5

[env:bancada]
extends = env:robo
build_flags = -DBANCADA

[env:robo_manual]
extends = env:robo
board_upload.before_reset = no-reset
