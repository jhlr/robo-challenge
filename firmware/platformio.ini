[platformio]
default_envs = bringup

[esp32_base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit TCS34725@^1.4.4
    pololu/QTRSensors@^4.0.0
    madhephaestus/ESP32Servo@^3.0.5

; STS car (default): 2 STS3215, one per lateral, gear train to 2 wheels each
; M1: serial-menu bring-up of every sensor and actuator
[env:bringup]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<../test/bench/bringup/>

; Bench: measures the effective track width (axle on the centre of a crossing, spins >1 turn); `pio run -e bitola -t upload`
[env:bitola]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<../test/bench/bitola/>

; Bench: pings STS ids 0..253 (3 tries each) and prints how many answered: finds wrong/duplicate ids and a flaky bus; `pio run -e scan -t upload`
[env:scan]
extends = esp32_base
lib_deps =
build_src_filter = -<*> +<../test/bench/scan/>

; Bench: configures ONE new STS alone on the bus: 'v' writes the voltage window (4.0..14.0 V), 'i' sets its id to the shoulder id 3 (serial commands); `pio run -e tensao -t upload`
[env:tensao]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<../test/bench/tensao/>

; Bench: sonar + RGB frente + RGB chao + MPU em tempo real, com scan I2C no boot; `pio run -e sensores -t upload && pio device monitor -e sensores`
[env:sensores]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<../test/bench/sensores/>

; M2: line follower + junction handling
[env:follow]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<follow/>

; Seguidor SeguidorRC (sem PID, barra RC, mapa + localizador): o sketch da biblioteca roda sobre hal/ e core/ do firmware
; A pilha BLE + OTA nao cabe nos 1,25 MB da particao padrao: min_spiffs.csv tem 2 particoes de app de 1,9 MB (OTA) e quase nada de SPIFFS (nao usado).
; Mudar a tabela de particoes exige gravar uma vez por USB; depois as atualizacoes vao por BLE (tools/ota_ble.py).
[env:seguidor]
extends = esp32_base
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<hal/> +<core/> +<seguidor/>
lib_deps =
    ${esp32_base.lib_deps}
    symlink://SeguidorRC

; A missao completa no carro STS: a logica do simulador (SeguidorRC/src/seguidor/robo.h) sobre o carro de verdade (src/robo/carro_real.h). O carro nao anda ao ligar: `g` no console serial.
[env:robo]
extends = esp32_base
build_src_filter = -<*> +<hal/> +<core/> +<robo/>
lib_deps =
    ${esp32_base.lib_deps}
    symlink://SeguidorRC

; Mesma coisa para a placa do carrinho, cujo reset automatico (DTR/RTS) nao coloca em modo de gravacao: segure BOOT, toque EN, solte BOOT e rode
; `pio run -e seguidor_manual -t upload` (o esptool nao tenta resetar, a placa ja esta em modo de gravacao).
[env:seguidor_manual]
extends = env:seguidor
board_upload.before_reset = no-reset

; Seguidor MINIMO para o carrinho (P+D na posicao da linha, sem cruzamento nem mapa): `pio run -e rapido` e envie por OTA
; (python SeguidorRC/tools/ota_ble.py .pio/build/rapido/firmware.bin). Comandos e ajustes pelo console BLE.
[env:rapido]
extends = esp32_base
board_build.partitions = min_spiffs.csv
build_src_filter = -<*> +<hal/> +<core/> +<rapido/>
lib_deps =
    ${esp32_base.lib_deps}
    symlink://SeguidorRC

; Mesmo `rapido` por USB sem reset automatico (a placa do carrinho falha com 0x13): segure BOOT, toque EN, mantenha BOOT e rode `pio run -e rapido_manual -t upload`.
[env:rapido_manual]
extends = env:rapido
board_upload.before_reset = no-reset

;  DC car (yellow TT motors, 2-input H-bridge, no encoders): same apps, other drive
[env:bringup_dc]
extends = env:bringup
build_flags = -DCAR_DC

[env:follow_dc]
extends = env:follow
build_flags = -DCAR_DC

; host-side unit tests of src/core (no board needed)
[env:native]
platform = native
build_flags = -Isrc
build_src_filter = -<*>
